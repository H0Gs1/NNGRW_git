    <h2>Bereken verwagte geboortedatum</h2>
    <p>Vul die dier en dekdatum in om te sien wanneer die boer moet begin voorberei vir geboorte.</p>

    <form id="gestation-form">
      <label for="animal">Kies dier</label>
      <select id="animal" required>
        <option value="">-- Kies --</option>
        <option value="cow">Koei</option>
      </select>

      <label for="mating-date">Dekdatum</label>
      <input type="date" id="mating-date" required>

      <button type="submit">Bereken</button>
    </form>

    <p id="result">Resultaat sal hier verskyn.</p>
